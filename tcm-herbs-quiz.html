<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常用中藥目錄無限測驗 · 中英對照與種類分類</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f6f5f1;
            --surface: #ffffff;
            --surface-hover: #faf9f6;
            --border: #e5e3dc;
            --border-strong: #d4d1c7;
            --ink: #171716;
            --ink-secondary: #686660;
            --ink-muted: #94918a;
            --accent: #185c4b;
            --accent-subtle: rgba(24, 92, 75, 0.08);
            --success: #15803d;
            --success-bg: #dcfce7;
            --error: #b91c1c;
            --error-bg: #fee2e2;
            --star: #d97706;
            --star-bg: #fef3c7;
            --radius: 10px;
        }

        body.dark-mode {
            --bg: #111315;
            --surface: #181a1d;
            --surface-hover: #1f2226;
            --border: #272a2f;
            --border-strong: #363a41;
            --ink: #eceae4;
            --ink-secondary: #9498a0;
            --ink-muted: #646870;
            --accent: #56b89d;
            --accent-subtle: rgba(86, 184, 157, 0.12);
            --success: #22c55e;
            --success-bg: rgba(34, 197, 94, 0.18);
            --error: #ef4444;
            --error-bg: rgba(239, 68, 68, 0.18);
            --star: #fbbf24;
            --star-bg: rgba(251, 191, 36, 0.18);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.55;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s ease, color 0.2s ease;
            -webkit-font-smoothing: antialiased;
        }

        /* Ultra-slim sticky top bar (44px on mobile) */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .nav-container {
            max-width: 960px;
            margin: 0 auto;
            height: 50px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .nav-btn {
            background: var(--surface);
            color: var(--ink-secondary);
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.8125rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            transition: all 0.15s ease;
        }

        .nav-btn:hover {
            background: var(--surface-hover);
            color: var(--ink);
            border-color: var(--border-strong);
        }

        .nav-btn.active {
            background: var(--accent-subtle);
            color: var(--accent);
            border-color: var(--accent);
            font-weight: 600;
        }

        .site-title {
            font-size: 0.95rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        main {
            max-width: 820px;
            width: 100%;
            margin: 16px auto 40px;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Control Panel */
        .control-bar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mode-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .mode-tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--ink-secondary);
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.15s ease;
        }
        .tab-btn:hover {
            border-color: var(--border-strong);
            color: var(--ink);
        }
        .tab-btn.active {
            background: var(--ink);
            color: var(--surface);
            border-color: var(--ink);
        }
        body.dark-mode .tab-btn.active {
            background: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
        }
        .tab-btn.wrong-tab {
            color: var(--error);
            background: var(--error-bg);
            border-color: rgba(185, 28, 28, 0.3);
        }
        .tab-btn.wrong-tab.active {
            background: var(--error);
            color: #fff;
            border-color: var(--error);
        }

        .sub-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding-top: 6px;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
            font-size: 0.78rem;
            color: var(--ink-secondary);
        }

        .select-inline {
            background: var(--bg);
            color: var(--ink);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 0.78rem;
            font-family: inherit;
            cursor: pointer;
        }

        .stats-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-variant-numeric: tabular-nums;
            flex-wrap: wrap;
        }

        .stat-pill {
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .stat-ok { background: var(--success-bg); color: var(--success); }
        .stat-err { background: var(--error-bg); color: var(--error); }
        .stat-round { background: var(--accent-subtle); color: var(--accent); }

        .progress-track {
            background: var(--border);
            height: 3px;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            background: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.25s ease;
        }

        /* Quiz Card */
        .quiz-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
            display: flex;
            flex-direction: column;
        }

        .q-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .q-badges {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            background: var(--accent-subtle);
            color: var(--accent);
        }
        .badge-dir {
            background: var(--star-bg);
            color: var(--star);
        }

        .q-counter {
            font-size: 0.8rem;
            color: var(--ink-muted);
            font-variant-numeric: tabular-nums;
        }

        .q-prompt {
            font-size: 0.82rem;
            color: var(--ink-secondary);
            margin-bottom: 6px;
        }

        .q-stem {
            font-size: 1.55rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 18px;
            line-height: 1.4;
            word-break: break-word;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .option-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--ink);
            font-size: 0.98rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            text-align: left;
            transition: all 0.14s ease;
        }

        .option-btn:hover:not(:disabled) {
            background: var(--surface-hover);
            border-color: var(--border-strong);
        }

        .opt-key {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--bg);
            border: 1px solid var(--border);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--ink-secondary);
            flex-shrink: 0;
        }

        .option-btn.correct {
            border-color: var(--success);
            background: var(--success-bg);
            color: var(--success);
            font-weight: 600;
        }
        .option-btn.correct .opt-key {
            background: var(--success);
            color: #fff;
            border-color: var(--success);
        }

        .option-btn.wrong {
            border-color: var(--error);
            background: var(--error-bg);
            color: var(--error);
            font-weight: 600;
        }
        .option-btn.wrong .opt-key {
            background: var(--error);
            color: #fff;
            border-color: var(--error);
        }

        .option-btn:disabled { cursor: default; }

        /* Feedback Box */
        .feedback-box {
            display: none;
            background: var(--bg);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 14px;
            font-size: 0.9rem;
        }
        .feedback-box.show { display: block; }

        .fb-title {
            font-weight: 700;
            margin-bottom: 4px;
        }
        .fb-detail {
            color: var(--ink-secondary);
            font-size: 0.86rem;
            line-height: 1.6;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .auto-next-wrap {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--ink-secondary);
            cursor: pointer;
            user-select: none;
        }

        .btn-primary {
            background: var(--ink);
            color: var(--surface);
            border: none;
            padding: 9px 18px;
            border-radius: 7px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }
        body.dark-mode .btn-primary {
            background: var(--accent);
            color: #0f172a;
        }
        .btn-primary:hover { opacity: 0.9; }

        /* Directory Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(3px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 14px;
        }
        .modal-overlay.open { display: flex; }

        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 720px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-head {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .modal-search {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--ink);
            font-family: inherit;
            font-size: 0.85rem;
        }

        .modal-body {
            padding: 12px 16px;
            overflow-y: auto;
            font-size: 0.84rem;
        }

        .dir-table {
            width: 100%;
            border-collapse: collapse;
        }
        .dir-table th, .dir-table td {
            border-bottom: 1px solid var(--border);
            padding: 7px 6px;
            text-align: left;
        }
        .dir-table th {
            font-size: 0.78rem;
            color: var(--ink-muted);
            position: sticky;
            top: -12px;
            background: var(--surface);
        }

        @media (max-width: 768px) {
            .nav-container { height: 44px; padding: 0 10px; }
            .nav-btn-text { display: none; }
            .site-title { font-size: 0.9rem; max-width: 150px; }
            main { margin: 8px auto 30px; padding: 0 10px; gap: 8px; }
            .control-bar { padding: 8px 10px; gap: 6px; }
            .quiz-card { padding: 14px; }
            .q-stem { font-size: 1.32rem; margin-bottom: 14px; }
            .option-btn { padding: 10px 12px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="nav-left">
                <a href="index.html" class="nav-btn" title="返回首頁">
                    <span>←</span>
                    <span class="nav-btn-text">首頁</span>
                </a>
                <span class="site-title">常用中藥目錄無限測驗</span>
            </div>
            <div class="nav-actions">
                <button class="nav-btn" onclick="openDirectory()" title="全目錄 163 味速查">
                    <span>📖</span>
                    <span class="nav-btn-text">目錄一覽 (163)</span>
                </button>
                <button class="nav-btn" onclick="resetStats()" title="重設目前紀錄">
                    <span>🔄</span>
                    <span class="nav-btn-text">重設</span>
                </button>
                <button id="themeToggleBtn" class="nav-btn" onclick="toggleTheme()" title="切換深色模式">
                    <span id="themeIcon">🌙</span>
                    <span id="themeText" class="nav-btn-text">深色</span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <section class="control-bar">
            <div class="mode-tabs" id="modeTabs">
                <button class="tab-btn active" data-mode="bilingual" onclick="setMode('bilingual', this)">🔤 中英對照 (雙向)</button>
                <button class="tab-btn" data-mode="category" onclick="setMode('category', this)">🏷️ 選出種類</button>
                <button class="tab-btn" data-mode="mixed" onclick="setMode('mixed', this)">⚡ 綜合無限</button>
                <button class="tab-btn wrong-tab" data-mode="wrong" onclick="setMode('wrong', this)">🎯 錯題重練 (<span id="wrongDeckCount">0</span>)</button>
            </div>

            <div class="sub-controls">
                <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                    <select id="chapterFilter" class="select-inline" onchange="onFilterChange()" title="篩選章節範圍">
                        <option value="ALL">全部章節（共 163 味）</option>
                    </select>
                    <select id="dirFilter" class="select-inline" onchange="onDirectionChange()" title="中英題型出題方向">
                        <option value="both">雙向隨機 (中⇄英)</option>
                        <option value="zh2en">只考 中 → 英</option>
                        <option value="en2zh">只考 英 → 中</option>
                    </select>
                </div>
                <div class="stats-group">
                    <span class="stat-pill stat-round" id="roundStat">第 1 輪 · 0/163</span>
                    <span class="stat-pill stat-ok">對 <span id="correctCount">0</span></span>
                    <span class="stat-pill stat-err">錯 <span id="wrongCount">0</span></span>
                    <span id="streakStat">連對 0</span>
                </div>
            </div>

            <div class="progress-track">
                <div class="progress-fill" id="progressBar"></div>
            </div>
        </section>

        <section class="quiz-card">
            <div class="q-meta">
                <div class="q-badges">
                    <span class="badge" id="typeBadge">中英對照</span>
                    <span class="badge badge-dir" id="subBadge">中 → 英</span>
                </div>
                <span class="q-counter" id="qCounter">總累計第 1 題</span>
            </div>

            <div class="q-prompt" id="qPrompt">請選出此中藥對應的英文（拉丁藥用名）：</div>
            <div class="q-stem" id="qStem">載入中...</div>

            <div class="options-list" id="optionsList"></div>

            <div class="feedback-box" id="feedbackBox">
                <div class="fb-title" id="fbTitle"></div>
                <div class="fb-detail" id="fbDetail"></div>
            </div>

            <div class="card-footer">
                <label class="auto-next-wrap">
                    <input type="checkbox" id="autoNextCheck">
                    <span>答對自動下一題</span>
                </label>
                <button class="btn-primary" id="nextBtn" onclick="nextQuestion()">下一題 →</button>
            </div>
        </section>
    </main>

    <!-- Full 163 Herbs Directory Modal -->
    <div class="modal-overlay" id="dirModal" onclick="if(event.target===this)closeDirectory()">
        <div class="modal-box">
            <div class="modal-head">
                <strong style="font-size:0.95rem;">常用中藥目錄總表（全 163 味）</strong>
                <input type="text" id="dirSearch" class="modal-search" placeholder="搜尋中文藥名、英文或分類（如：夏枯草、清熱瀉火藥、Radix）..." oninput="renderDirectory()" style="max-width:340px;">
                <button class="nav-btn" onclick="closeDirectory()">✕</button>
            </div>
            <div class="modal-body">
                <table class="dir-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>中藥名</th>
                            <th>英文 / 拉丁名</th>
                            <th>種類</th>
                            <th>章節</th>
                        </tr>
                    </thead>
                    <tbody id="dirTbody"></tbody>
                </table>
            </div>
        </div>
    </div>

        // Theme sync (tajen_quiz_theme)
        const THEME_KEY = 'tajen_quiz_theme';
        function applyTheme(dark) {
            document.body.classList.toggle('dark-mode', dark);
            const ic = document.getElementById('themeIcon');
            const tx = document.getElementById('themeText');
            if (ic) ic.textContent = dark ? '☀️' : '🌙';
            if (tx) tx.textContent = dark ? '淺色' : '深色';
        }
        function toggleTheme() {
            const dark = !document.body.classList.contains('dark-mode');
            applyTheme(dark);
            try { localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light'); } catch(e) {}
        }
        try {
            if (localStorage.getItem(THEME_KEY) === 'dark') applyTheme(true);
        } catch(e) {}

        // Unique categories & chapters
        const ALL_CATEGORIES = [...new Set(HERBS_DATA.map(h => h.category))];
        const ALL_CHAPTERS = [...new Set(HERBS_DATA.map(h => h.chapter))];

        // Populate chapter dropdown
        const chapterSel = document.getElementById('chapterFilter');
        ALL_CHAPTERS.forEach(ch => {
            const count = HERBS_DATA.filter(h => h.chapter === ch).length;
            const opt = document.createElement('option');
            opt.value = ch;
            opt.textContent = `${ch}（${count} 味）`;
            chapterSel.appendChild(opt);
        });

        // Quiz State (Infinite Shuffle-Bag Deck)
        let currentMode = 'bilingual'; // 'bilingual' | 'category' | 'mixed' | 'wrong'
        let biDirection = 'both';      // 'both' | 'zh2en' | 'en2zh'
        let selectedChapter = 'ALL';

        let pool = [...HERBS_DATA];
        let bag = [];
        let roundNum = 1;
        let roundTotal = HERBS_DATA.length;
        let roundDone = 0;

        let totalDone = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let streak = 0;
        let wrongIds = new Set();

        try {
            const savedWrong = JSON.parse(localStorage.getItem('tcm_herbs_wrong_ids') || '[]');
            savedWrong.forEach(id => wrongIds.add(id));
        } catch(e) {}

        let currentQuestion = null;
        let isAnswered = false;
        let autoNextTimer = null;

        function saveWrongIds() {
            try { localStorage.setItem('tcm_herbs_wrong_ids', JSON.stringify([...wrongIds])); } catch(e) {}
            document.getElementById('wrongDeckCount').textContent = wrongIds.size;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function rebuildPool() {
            if (currentMode === 'wrong') {
                pool = HERBS_DATA.filter(h => wrongIds.has(h.id));
                if (selectedChapter !== 'ALL') {
                    pool = pool.filter(h => h.chapter === selectedChapter);
                }
            } else {
                pool = selectedChapter === 'ALL'
                    ? [...HERBS_DATA]
                    : HERBS_DATA.filter(h => h.chapter === selectedChapter);
            }
            roundNum = 1;
            roundDone = 0;
            roundTotal = pool.length;
            bag = shuffle(pool);
        }

        function drawFromBag() {
            if (pool.length === 0) return null;
            if (bag.length === 0) {
                roundNum++;
                roundDone = 0;
                bag = shuffle(pool);
            }
            const item = bag.pop();
            roundDone++;
            return item;
        }

        function getEnDisplay(item) {
            return item.alt_en ? `${item.en} (${item.alt_en})` : item.en;
        }

        // Smart distractor helper for Latin names (prefers same medicinal part suffix like Radix/Fructus/Herba)
        function getPartSuffix(en) {
            const parts = en.trim().split(/\s+/);
            return parts[parts.length - 1].toLowerCase();
        }

        function buildQuestion() {
            const item = drawFromBag();
            if (!item) return null;

            let qType = currentMode;
            if (qType === 'mixed' || qType === 'wrong') {
                qType = Math.random() < 0.5 ? 'bilingual' : 'category';
            }

            if (qType === 'bilingual') {
                let dir = biDirection;
                if (dir === 'both') dir = Math.random() < 0.5 ? 'zh2en' : 'en2zh';

                if (dir === 'zh2en') {
                    const correctText = item.en;
                    const suffix = getPartSuffix(item.en);
                    const sameSuffix = HERBS_DATA.filter(h => h.id !== item.id && h.en !== item.en && getPartSuffix(h.en) === suffix);
                    const others = HERBS_DATA.filter(h => h.id !== item.id && h.en !== item.en && getPartSuffix(h.en) !== suffix);

                    let distractors = shuffle(sameSuffix).slice(0, 3);
                    if (distractors.length < 3) {
                        distractors = distractors.concat(shuffle(others).slice(0, 3 - distractors.length));
                    }
                    const options = shuffle([correctText, ...distractors.map(d => d.en)]);
                    return {
                        item,
                        qType: 'bilingual',
                        dir: 'zh2en',
                        typeLabel: '中英對照',
                        subLabel: '中 → 英',
                        prompt: '請選出此中藥對應的英文（拉丁藥用名）：',
                        stem: item.zh,
                        options,
                        correct: correctText
                    };
                } else {
                    const correctText = item.zh;
                    const suffix = getPartSuffix(item.en);
                    const sameSuffix = HERBS_DATA.filter(h => h.id !== item.id && h.zh !== item.zh && getPartSuffix(h.en) === suffix);
                    const others = HERBS_DATA.filter(h => h.id !== item.id && h.zh !== item.zh && getPartSuffix(h.en) !== suffix);

                    let distractors = shuffle(sameSuffix).slice(0, 3);
                    if (distractors.length < 3) {
                        distractors = distractors.concat(shuffle(others).slice(0, 3 - distractors.length));
                    }
                    const options = shuffle([correctText, ...distractors.map(d => d.zh)]);
                    return {
                        item,
                        qType: 'bilingual',
                        dir: 'en2zh',
                        typeLabel: '中英對照',
                        subLabel: '英 → 中',
                        prompt: '請選出此英文（拉丁藥用名）對應的中藥名：',
                        stem: getEnDisplay(item),
                        options,
                        correct: correctText
                    };
                }
            } else {
                // Category mode: Chinese herb -> choose Category
                const correctCat = item.category;
                const otherCats = shuffle(ALL_CATEGORIES.filter(c => c !== correctCat)).slice(0, 3);
                const options = shuffle([correctCat, ...otherCats]);
                return {
                    item,
                    qType: 'category',
                    dir: 'cat',
                    typeLabel: '藥材分類',
                    subLabel: '選出種類',
                    prompt: '請選出此中藥所屬的功效分類（種類）：',
                    stem: item.zh,
                    options,
                    correct: correctCat
                };
            }
        }

        function renderQuestion() {
            if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
            isAnswered = false;
            document.getElementById('feedbackBox').classList.remove('show');

            currentQuestion = buildQuestion();
            const optBox = document.getElementById('optionsList');
            optBox.innerHTML = '';

            if (!currentQuestion) {
                document.getElementById('typeBadge').textContent = '錯題本空空如也';
                document.getElementById('subBadge').textContent = '全部精通';
                document.getElementById('qPrompt').textContent = '目前沒有待練習的錯題！';
                document.getElementById('qStem').textContent = '請切換回「中英對照」或「選出種類」繼續無限刷題 🎉';
                document.getElementById('roundStat').textContent = '0 題';
                document.getElementById('progressBar').style.width = '100%';
                return;
            }

            totalDone++;
            document.getElementById('typeBadge').textContent = currentQuestion.typeLabel;
            document.getElementById('subBadge').textContent = currentQuestion.subLabel;
            document.getElementById('qCounter').textContent = `總累計第 ${totalDone} 題`;
            document.getElementById('qPrompt').textContent = currentQuestion.prompt;
            document.getElementById('qStem').textContent = currentQuestion.stem;

            document.getElementById('roundStat').textContent = `第 ${roundNum} 輪 · ${roundDone}/${roundTotal}`;
            document.getElementById('progressBar').style.width = `${(roundDone / Math.max(1, roundTotal)) * 100}%`;

            const keys = ['A', 'B', 'C', 'D'];
            currentQuestion.options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="opt-key">${keys[idx]}</span><span>${optText}</span>`;
                btn.onclick = () => selectOption(idx, optText, btn);
                optBox.appendChild(btn);
            });
        }

        function selectOption(idx, chosenText, btnEl) {
            if (isAnswered || !currentQuestion) return;
            isAnswered = true;

            const isRight = (chosenText === currentQuestion.correct);
            const buttons = document.querySelectorAll('#optionsList .option-btn');
            buttons.forEach((b, i) => {
                b.disabled = true;
                if (currentQuestion.options[i] === currentQuestion.correct) {
                    b.classList.add('correct');
                } else if (b === btnEl && !isRight) {
                    b.classList.add('wrong');
                }
            });

            if (isRight) {
                correctCount++;
                streak++;
                if (currentMode === 'wrong') {
                    wrongIds.delete(currentQuestion.item.id);
                }
            } else {
                wrongCount++;
                streak = 0;
                wrongIds.add(currentQuestion.item.id);
            }
            saveWrongIds();

            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;
            document.getElementById('streakStat').textContent = `連對 ${streak}`;

            const fbBox = document.getElementById('feedbackBox');
            const fbTitle = document.getElementById('fbTitle');
            const fbDetail = document.getElementById('fbDetail');

            fbTitle.textContent = isRight ? '✓ 答對了！' : `✗ 答錯了 — 正確答案：${currentQuestion.correct}`;
            fbTitle.style.color = isRight ? 'var(--success)' : 'var(--error)';

            const it = currentQuestion.item;
            const secStr = it.section ? ` · ${it.section}` : '';
            fbDetail.innerHTML = `<strong>${it.zh}</strong>｜${getEnDisplay(it)}<br>分類：<strong>${it.category}</strong>（${it.chapter}${secStr}）`;
            fbBox.classList.add('show');

            if (isRight && document.getElementById('autoNextCheck').checked) {
                autoNextTimer = setTimeout(() => nextQuestion(), 650);
            }
        }

        function nextQuestion() {
            renderQuestion();
        }

        function setMode(mode, btnEl) {
            currentMode = mode;
            document.querySelectorAll('#modeTabs .tab-btn').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');
            document.getElementById('dirFilter').style.display = (mode === 'category') ? 'none' : 'inline-block';
            rebuildPool();
            renderQuestion();
        }

        function onDirectionChange() {
            biDirection = document.getElementById('dirFilter').value;
            renderQuestion();
        }

        function onFilterChange() {
            selectedChapter = document.getElementById('chapterFilter').value;
            rebuildPool();
            renderQuestion();
        }

        function resetStats() {
            if (!confirm('確定重設答題次數、連對與錯題紀錄嗎？')) return;
            totalDone = 0;
            correctCount = 0;
            wrongCount = 0;
            streak = 0;
            wrongIds.clear();
            saveWrongIds();
            document.getElementById('correctCount').textContent = '0';
            document.getElementById('wrongCount').textContent = '0';
            document.getElementById('streakStat').textContent = '連對 0';
            rebuildPool();
            renderQuestion();
        }

        // Directory Modal
        function openDirectory() {
            document.getElementById('dirModal').classList.add('open');
            renderDirectory();
        }
        function closeDirectory() {
            document.getElementById('dirModal').classList.remove('open');
        }
        function renderDirectory() {
            const kw = (document.getElementById('dirSearch').value || '').trim().toLowerCase();
            const tbody = document.getElementById('dirTbody');
            const filtered = HERBS_DATA.filter(h =>
                !kw ||
                h.zh.toLowerCase().includes(kw) ||
                h.en.toLowerCase().includes(kw) ||
                (h.alt_en && h.alt_en.toLowerCase().includes(kw)) ||
                h.category.toLowerCase().includes(kw) ||
                h.chapter.toLowerCase().includes(kw)
            );
            tbody.innerHTML = filtered.map(h => `
                <tr>
                    <td style="color:var(--ink-muted); font-variant-numeric:tabular-nums;">${h.id}</td>
                    <td><strong>${h.zh}</strong></td>
                    <td>${getEnDisplay(h)}</td>
                    <td><span class="badge">${h.category}</span></td>
                    <td style="color:var(--ink-secondary); font-size:0.78rem;">${h.chapter}</td>
                </tr>
            `).join('');
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (document.getElementById('dirModal').classList.contains('open')) {
                if (e.key === 'Escape') closeDirectory();
                return;
            }
            const map = { '1': 0, '2': 1, '3': 2, '4': 3, 'a': 0, 'b': 1, 'c': 2, 'd': 3, 'A': 0, 'B': 1, 'C': 2, 'D': 3 };
            if (e.key in map && !isAnswered && currentQuestion) {
                const idx = map[e.key];
                const btns = document.querySelectorAll('#optionsList .option-btn');
                if (btns[idx]) btns[idx].click();
            } else if ((e.key === 'Enter' || e.key === ' ') && isAnswered) {
                e.preventDefault();
                nextQuestion();
            }
        });

        // Init from URL query (?mode=bilingual|category|mixed)
        (function init() {
            saveWrongIds();
            const params = new URLSearchParams(window.location.search);
            const m = params.get('mode');
            if (m && ['bilingual', 'category', 'mixed', 'wrong'].includes(m)) {
                const btn = document.querySelector(`#modeTabs .tab-btn[data-mode="${m}"]`);
                setMode(m, btn);
            } else {
                rebuildPool();
                renderQuestion();
            }
        })();
    </script>
</body>
</html>
